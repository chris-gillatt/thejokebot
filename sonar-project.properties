sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

sonar.exclusions=references/**,tests/**,state/**,dashboard/data/**,images/**,.agent-tmp/**,resources/**
sonar.coverage.exclusions=dashboard/**
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# Sonar's generic dependency rule does not recognise pip-compile's hashed
# requirements.lock. The lock is installed with --require-hashes in every CI job.
sonar.issue.ignore.multicriteria=pipCompileLock
sonar.issue.ignore.multicriteria.pipCompileLock.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.pipCompileLock.resourceKey=pyproject.toml
