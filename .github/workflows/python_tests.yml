name: python_tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: changed_files
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'images/**'
            non_docs:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!images/**'

      - name: Report docs-only skip decision
        if: github.event_name != 'workflow_dispatch' && steps.changed_files.outputs.docs == 'true' && steps.changed_files.outputs.non_docs != 'true'
        run: echo "Docs-only change detected; skipping python_tests job steps."

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.changed_files.outputs.non_docs == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.changed_files.outputs.non_docs == 'true'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Run unit tests
        if: github.event_name == 'workflow_dispatch' || steps.changed_files.outputs.non_docs == 'true'
        run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=75

      - name: Run SonarQube Cloud analysis
        if: >
          (github.event_name == 'workflow_dispatch' || steps.changed_files.outputs.non_docs == 'true') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Require zero unresolved Sonar issues
        if: >
          (github.event_name == 'workflow_dispatch' || steps.changed_files.outputs.non_docs == 'true') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BRANCH: ${{ github.event_name != 'pull_request' && github.ref_name || '' }}
          SONAR_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        run: python scripts/check_sonar_issues.py
