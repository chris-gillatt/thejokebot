name: bluesky_post_joke

on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"  # Runs every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  workflow_dispatch:

concurrency:
  group: joke_and_social_state_writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bluesky_post_joke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Restore Bluesky session cache
        id: bluesky_session_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .agent-tmp/bluesky_session.txt.enc
          key: bluesky-session-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bluesky-session-v2-${{ github.ref_name }}-

      - name: Decrypt Bluesky session cache
        env:
          BLUESKY_SESSION_CACHE_KEY: ${{ secrets.BLUESKY_SESSION_CACHE_KEY }}
        run: scripts/restore_bluesky_session.sh

      - name: Run bluesky_post_joke
        env:
          BLUESKY_USERNAME: ${{ vars.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_PASSWORD_SOURCE: app_password
          BLUESKY_SESSION_RESTORE_ENABLED: "true"
          BLUESKY_SESSION_PERSIST_ENABLED: "true"
          BLUESKY_SESSION_FILE_PATH: .agent-tmp/bluesky_session.txt
          API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
        run: thejokebot-post-joke

      - name: Encrypt Bluesky session cache
        if: always()
        env:
          BLUESKY_SESSION_CACHE_KEY: ${{ secrets.BLUESKY_SESSION_CACHE_KEY }}
        run: scripts/prepare_bluesky_session_cache.sh

      - name: Save Bluesky session cache
        if: always() && hashFiles('.agent-tmp/bluesky_session.txt.enc') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .agent-tmp/bluesky_session.txt.enc
          key: bluesky-session-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist posting state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/persist_workflow_state.py \
            --commit-message "chore(posting): update state; GH run: ${GITHUB_RUN_NUMBER}" \
            state/posting_state.json
