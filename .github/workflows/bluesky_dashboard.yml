name: bluesky_dashboard

on:
  schedule:
    - cron: "30 0,6,12,18 * * *"  # every six hours, offset from posting
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "src/thejokebot/commands/collect_dashboard_metrics.py"
      - ".github/workflows/bluesky_dashboard.yml"

concurrency:
  group: dashboard_metrics_writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Collect dashboard metrics
        env:
          BLUESKY_USERNAME: ${{ vars.BLUESKY_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: thejokebot-collect-dashboard-metrics

      - name: Persist dashboard metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/persist_workflow_state.py \
            --commit-message "chore(dashboard): update public metrics; GH run: ${GITHUB_RUN_NUMBER}" \
            dashboard/data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Prepare Pages artifact
        run: ./scripts/prepare-dashboard-pages.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .agent-tmp/pages

  deploy:
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: ${{ format('{0}-{1}', 'github', 'pages') }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
