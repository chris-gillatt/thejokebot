name: bluesky_acknowledge_starter_packs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Baseline existing memberships without thanks, or preview proposed thanks
        type: choice
        options:
          - preview
          - baseline
        default: preview
      pack_uri:
        description: Optional canonical starter-pack AT URI alongside retained candidates
        type: string
        default: ""

concurrency:
  group: joke_and_social_state_writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Baseline or preview known memberships
        id: acknowledgement
        env:
          MODE: ${{ inputs.mode }}
          BLUESKY_USERNAME: ${{ vars.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_PASSWORD_SOURCE: app_password
          BLUESKY_INSPECT_PACK_URI: ${{ inputs.pack_uri }}
        run: |
          case "$MODE" in
            baseline|preview) thejokebot-acknowledge-starter-packs --mode "$MODE" ;;
            *) echo "Unsupported starter-pack mode" >&2; exit 1 ;;
          esac
      - name: Persist baseline state
        if: inputs.mode == 'baseline' && steps.acknowledgement.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/persist_workflow_state.py \
            --commit-message "chore(social): baseline starter-pack memberships; GH run: ${GITHUB_RUN_NUMBER}" \
            state/social_state.json
