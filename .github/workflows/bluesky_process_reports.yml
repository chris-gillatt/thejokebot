name: bluesky_process_reports

on:
  schedule:
    - cron: "40 */4 * * *"  # Runs every 4 hours (UTC), offset from other state writers
  workflow_dispatch:

concurrency:
  group: moderation_state_writer
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bluesky_process_reports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Restore Bluesky session cache
        id: bluesky_session_cache
        uses: actions/cache/restore@v6
        with:
          path: .agent-tmp/bluesky_session.txt.enc
          key: bluesky-session-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bluesky-session-v2-${{ github.ref_name }}-

      - name: Decrypt Bluesky session cache
        env:
          BLUESKY_SESSION_CACHE_KEY: ${{ secrets.BLUESKY_SESSION_CACHE_KEY }}
        run: scripts/restore_bluesky_session.sh

      - name: Process #report replies
        env:
          BLUESKY_USERNAME: ${{ vars.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_PASSWORD_SOURCE: app_password
          BLUESKY_SESSION_RESTORE_ENABLED: "true"
          BLUESKY_SESSION_PERSIST_ENABLED: "true"
          BLUESKY_SESSION_FILE_PATH: .agent-tmp/bluesky_session.txt
          BLUESKY_REPORT_OUTPUT: .agent-tmp/report_proposals.json
        run: thejokebot-process-reports

      - name: Encrypt Bluesky session cache
        if: always()
        env:
          BLUESKY_SESSION_CACHE_KEY: ${{ secrets.BLUESKY_SESSION_CACHE_KEY }}
        run: scripts/prepare_bluesky_session_cache.sh

      - name: Save Bluesky session cache
        if: always() && hashFiles('.agent-tmp/bluesky_session.txt.enc') != ''
        uses: actions/cache/save@v6
        with:
          path: .agent-tmp/bluesky_session.txt.enc
          key: bluesky-session-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist report checkpoint state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/persist_workflow_state.py \
            --commit-message "chore(reports): update report checkpoint state; GH run: ${GITHUB_RUN_NUMBER}" \
            state/moderation_state.json

      - name: Create denylist PRs for new reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLUESKY_REPORT_OUTPUT: .agent-tmp/report_proposals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          thejokebot-create-report-prs
