name: bluesky_review_reposts

on:
  schedule:
    - cron: "15 9 * * *"  # Daily inventory; review creation requires the repository variable.
  workflow_dispatch:
    inputs:
      preview:
        description: Read-only discovery; do not create review issues or change saved state
        type: boolean
        default: true
  issues:
    types: [opened, closed]

concurrency:
  group: joke_and_social_state_writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  review_reposts:
    if: >-
      github.repository_id == '901122902' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
       (vars.BLUESKY_REPOSTS_ENABLED == 'true' &&
        (github.event.sender.type != 'Bot' &&
          (startsWith(github.event.issue.title, '[Repost review]') ||
           startsWith(github.event.issue.title, '[Repost report]')))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Discover or handle a review
        id: reposts
        env:
          BLUESKY_USERNAME: ${{ vars.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_PASSWORD_SOURCE: app_password
          BLUESKY_REPOSTS_ENABLED: ${{ vars.BLUESKY_REPOSTS_ENABLED }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOST_EVENT: ${{ github.event_name }}
          REPOST_PREVIEW: ${{ inputs.preview }}
        run: |
          if [[ "$REPOST_EVENT" == "issues" ]]; then
            thejokebot-review-reposts --mode issue
          elif [[ "$REPOST_EVENT" == "workflow_dispatch" && "$REPOST_PREVIEW" == "true" ]]; then
            thejokebot-review-reposts --mode preview
          elif [[ "$REPOST_EVENT" == "schedule" && "$BLUESKY_REPOSTS_ENABLED" != "true" ]]; then
            thejokebot-review-reposts --mode inventory
          else
            thejokebot-review-reposts --mode discover
          fi

      - name: Upload read-only review preview
        if: github.event_name == 'workflow_dispatch' && inputs.preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repost-preview
          path: |
            .agent-tmp/repost_preview.json
            .agent-tmp/repost_preview.html
          if-no-files-found: error
          retention-days: 7

      - name: Persist review state even after a failed action
        if: >-
          always() &&
          (steps.reposts.outcome == 'success' || steps.reposts.outcome == 'failure') &&
          !(github.event_name == 'workflow_dispatch' && inputs.preview)
        run: |
          test "$(git branch --show-current)" = main
          python -c 'import json; from pathlib import Path; payload = json.loads(Path("state/social_state.json").read_text()); assert isinstance(payload, dict), "Social state must be a JSON object"'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/persist_workflow_state.py \
            --commit-message "chore(reposts): persist review outcomes; GH run: ${GITHUB_RUN_NUMBER}" \
            state/social_state.json
