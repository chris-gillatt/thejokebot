name: ruff_quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: changed_files
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'images/**'
            non_docs:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!images/**'

      - name: Report docs-only skip decision
        if: github.event_name != 'workflow_dispatch' && steps.changed_files.outputs.docs == 'true' && steps.changed_files.outputs.non_docs != 'true'
        run: echo "Docs-only change detected; skipping ruff_quality job steps."

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.changed_files.outputs.non_docs == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"

      - name: Install Ruff
        if: github.event_name == 'workflow_dispatch' || steps.changed_files.outputs.non_docs == 'true'
        run: "python -m pip install --only-binary=:all: ruff==0.17.3"

      - name: Run Ruff lint
        if: github.event_name == 'workflow_dispatch' || steps.changed_files.outputs.non_docs == 'true'
        run: ruff check .

      - name: Run Ruff format check
        if: github.event_name == 'workflow_dispatch' || steps.changed_files.outputs.non_docs == 'true'
        run: ruff format --check .
