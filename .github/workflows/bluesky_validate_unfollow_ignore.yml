name: bluesky_validate_unfollow_ignore

on:
  schedule:
    - cron: "0 9 1 * *"  # monthly at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_unfollow_ignore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Validate unfollow ignore handles
        env:
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_USERNAME: ${{ vars.BLUESKY_USERNAME }}
          BLUESKY_UNFOLLOW_IGNORE_SECRET: ${{ secrets.BLUESKY_UNFOLLOW_IGNORE }}
          BLUESKY_UNFOLLOW_IGNORE_VAR: ${{ vars.BLUESKY_UNFOLLOW_IGNORE }}
          BLUESKY_FAIL_ON_STALE_IGNORE: "true"
        run: |
          export BLUESKY_UNFOLLOW_IGNORE="${BLUESKY_UNFOLLOW_IGNORE_SECRET:-$BLUESKY_UNFOLLOW_IGNORE_VAR}"
          thejokebot-validate-unfollow-ignore
