name: bluesky_manage_starter_pack

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        default: "setup"
        type: choice
        options:
          - setup
          - sync
          - pull
      apply_changes:
        description: "If true, execute live mutations (otherwise dry-run)."
        required: true
        default: false
        type: boolean

concurrency:
  group: bluesky_manage_starter_pack
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bluesky_manage_starter_pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Run starter-pack manager
        env:
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_USERNAME: ${{ vars.BLUESKY_USERNAME }}
          MODE: ${{ inputs.mode }}
          APPLY_CHANGES: ${{ inputs.apply_changes }}
        run: |
          if [ "$APPLY_CHANGES" = "true" ]; then
            export BLUESKY_DRY_RUN="false"
          else
            export BLUESKY_DRY_RUN="true"
          fi
          thejokebot-manage-starter-pack --mode "$MODE"

      - name: Commit pulled config changes
        if: ${{ inputs.mode == 'pull' && inputs.apply_changes == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/persist_workflow_state.py \
            --commit-message "chore(starter-pack): pull live metadata from Bluesky [skip ci]" \
            resources/jokebot_starter_pack.json
