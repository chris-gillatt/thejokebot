name: provider_health_check

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: provider_health_state_writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  health_check:
    runs-on: ubuntu-latest
    env:
      API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Check providers and update health state
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/update_provider_health.py

      - name: Commit state if changed
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          python scripts/persist_workflow_state.py \
            --commit-message "chore: update provider health check state; GH run: ${GITHUB_RUN_NUMBER}" \
            state/provider_health_state.json
