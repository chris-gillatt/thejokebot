name: provider_health_check

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: provider_health_state_writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  health_check:
    runs-on: ubuntu-latest
    env:
      API_NINJAS_API_KEY: ${{ secrets.API_NINJAS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check providers and update health state
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/update_provider_health.py

      - name: Commit state if changed
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if git diff --quiet state/provider_health_state.json; then
            echo "No changes to provider health state"
          else
            git add state/provider_health_state.json
            git commit -m "chore: update provider health check state; GH run: ${{ github.run_number }}"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts."
                exit 1
              fi
              echo "Push rejected, retrying (${attempt}/3)..."
            done
          fi
