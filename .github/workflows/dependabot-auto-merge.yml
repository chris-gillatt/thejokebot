name: pr_auto_merge

on:
  workflow_run:
    workflows: [python_tests, ruff_quality, codeql, validate_runtime_config]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge_verified_updates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Merge verified Dependabot updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDABOT_WORKFLOW_TOKEN: ${{ secrets.DEPENDABOT_WORKFLOW_TOKEN }}
        run: python3 scripts/merge_dependabot.py
