name: pr_auto_merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable_auto_merge:
    if: github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-latest

    steps:
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2

      - name: Enable squash auto-merge
        if: >
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set +e
          merge_output="$(gh pr merge --auto --squash "$PR_URL" 2>&1)"
          exit_code=$?
          set -e

          echo "$merge_output"

          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi

          if echo "$merge_output" | grep -Eqi "Auto merge is not allowed|Base branch was modified|Review and try the merge again"; then
            echo "::notice::Auto-merge could not be enabled for this PR yet; leaving PR checks green."
            exit 0
          fi

          echo "::error::Unexpected failure while enabling auto-merge."
          exit "$exit_code"
