name: Report a repost
description: Flag unsuitable content reposted by The Joke Bot for maintainer review.
title: "[Repost report] "
assignees:
  - chris-gillatt
body:
  - type: markdown
    attributes:
      value: |
        This report is public and notifies the assigned maintainer through GitHub.
        Supply the original post link, not a screenshot containing private information.
        An approved removal deletes only TJB's repost, never the original author's post.
        GitHub email delivery depends on the maintainer's notification settings.
  - type: input
    id: original-post
    attributes:
      label: Original Bluesky post
      description: An https://bsky.app/profile/.../post/... link or canonical at://... post URI.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain what needs review. Do not include private information.
    validations:
      required: true
