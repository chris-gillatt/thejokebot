[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thejokebot"
version = "0.0.0"
description = "Automation for The Joke Bot on Bluesky"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
thejokebot-collect-dashboard-metrics = "thejokebot.commands.collect_dashboard_metrics:main"
thejokebot-create-report-prs = "thejokebot.commands.create_report_prs:main"
thejokebot-follow-fellows = "thejokebot.commands.follow_fellows:main"
thejokebot-follows-and-likes = "thejokebot.commands.follows_and_likes:main"
thejokebot-manage-starter-pack = "thejokebot.commands.manage_starter_pack:main"
thejokebot-post-joke = "thejokebot.commands.post_joke:main"
thejokebot-process-reports = "thejokebot.commands.process_reports:main"
thejokebot-unfollow = "thejokebot.commands.unfollow:main"
thejokebot-validate-runtime-config = "thejokebot.commands.validate_runtime_config:main"
thejokebot-validate-unfollow-ignore = "thejokebot.commands.validate_unfollow_ignore:main"
thejokebot-verify-latest-joke-post = "thejokebot.commands.verify_latest_joke_post:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Exclude read-only reference submodules from all checks.
exclude = ["references/"]

[tool.ruff.lint]
# C901: flag functions whose McCabe complexity exceeds max-complexity.
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
# Measure first-party application code; skip tests and read-only submodules.
omit = ["references/**", "tests/**"]
source = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["references"]
