[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thejokebot"
version = "0.0.0"
description = "Automation for The Joke Bot on Bluesky"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Exclude read-only reference submodules from all checks.
exclude = ["references/"]

[tool.ruff.lint]
# C901: flag functions whose McCabe complexity exceeds max-complexity.
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
# Measure first-party application code; skip tests and read-only submodules.
omit = ["references/**", "tests/**"]
source = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["references"]
